<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AprendeCode · Verificar correo</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/aprendecode-icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f8cff" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-force-dark="true">
  <header class="header">
    <span class="mission-tag">Cuenta</span>
    <h1>Verificación de correo</h1>
    <p>Confirma tu correo para activar la cuenta.</p>
  </header>

  <main class="main-container single-column">
    <section class="exercise-card">
      <div class="exercise-header">
        <div>
          <h2 class="exercise-title">Estado</h2>
          <p class="exercise-subtitle">Pulsa el botón para verificar tu cuenta.</p>
        </div>
      </div>

      <div class="exercise-body">
        <div class="exercise-block">
          <p id="verify-status" class="status-msg" style="display:none;"></p>
          <button id="confirm-verify-btn" class="btn btn-primary" type="button" style="margin-top:16px;">
            Verificar correo
          </button>

          <div id="resend-verification-panel" style="display:none; margin-top:16px;">
            <div class="field">
              <label for="resend-email">Email</label>
              <input id="resend-email" type="email" placeholder="tuemail@ejemplo.com" autocomplete="email" />
              <p class="mini-note">Introduce el email con el que creaste la cuenta para recibir un nuevo enlace.</p>
            </div>

            <button id="resend-verification-btn" class="btn btn-secondary" type="button">
              Reenviar correo de verificación
            </button>

            <p id="resend-status" class="status-msg" style="display:none;"></p>
          </div>
          <div class="buttons-row" style="margin-top:16px;">
            <a class="btn btn-primary" href="login.html">Ir a login</a>
            <a class="btn btn-secondary" href="register.html">Volver a registro</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="./config.js"></script>
  <script src="./theme-init.js"></script>
  <script src="./verify-email.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
